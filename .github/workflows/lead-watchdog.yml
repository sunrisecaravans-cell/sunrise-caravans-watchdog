name: Lead Delivery Watchdog

on:
  schedule:
    # 22:00 UTC = 8:00 AM Brisbane (AEST, UTC+10)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      # CRM database (heartbeat lives here, in agent_runs)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Website database (where the leads table lives). Both have public built-in defaults below;
      # these secrets only override them.
      LEADS_SUPABASE_URL: ${{ secrets.LEADS_SUPABASE_URL }}
      LEADS_SUPABASE_KEY: ${{ secrets.LEADS_SUPABASE_KEY }}
      # Log in to the website database as an admin user (no master key needed).
      LEADS_ADMIN_EMAIL: ${{ secrets.LEADS_ADMIN_EMAIL }}
      LEADS_ADMIN_PASSWORD: ${{ secrets.LEADS_ADMIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Install dependencies
        run: pip install requests

      - name: Run Lead Delivery Watchdog
        run: |
          python3 - <<'PYEOF'
          import os, sys, re, json, base64, requests
          from datetime import datetime, timedelta, timezone

          def log(msg):
              print(f"[{datetime.now(timezone.utc):%Y-%m-%d %H:%M:%S} UTC] {msg}", flush=True)

          def env(name):
              raw = os.getenv(name) or ""
              # Phones and chat apps sneak invisible characters (zero-width spaces, non-breaking
              # spaces, smart quotes) into pasted secrets. Every value read here is plain printable
              # ASCII with no spaces, so anything else is junk: drop it and say how much was dropped.
              cleaned = "".join(ch for ch in raw if 0x21 <= ord(ch) <= 0x7E)
              dropped = len(raw) - len(cleaned)
              if dropped and raw.strip() != cleaned:
                  log(f"Cleaned {dropped} hidden/invisible character(s) out of the {name} secret")
              return cleaned

          # The website's Supabase project. The URL and the anon ("publishable") key are PUBLIC values:
          # they ship in the site's own .env and to every visitor's browser. Building them in here means
          # nobody has to paste a 208-character key by hand. A pasted secret still wins if it is valid.
          WEBSITE_PROJECT_REF = "kmxriwfsuvrdwjbwfloh"
          WEBSITE_URL = f"https://{WEBSITE_PROJECT_REF}.supabase.co"
          WEBSITE_ANON_KEY = ("eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9."
                              "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtteHJpd2ZzdXZyZHdqYndmbG9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzI5NTEsImV4cCI6MjA4ODYwODk1MX0."
                              "i9zqQJ-_BUm_DFpALeuGV6Yg-kvQE6qnF4R9SVWxvH0")
          WATCHDOG_EMAIL = "sunrisecaravans+watchdog@gmail.com"

          def jwt_claims(token):
              try:
                  part = token.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part))
              except Exception:
                  return None

          CRM_URL = env("SUPABASE_URL").rstrip("/")
          CRM_KEY = env("SUPABASE_SECRET_KEY")

          LEADS_URL = (env("LEADS_SUPABASE_URL") or WEBSITE_URL).rstrip("/")
          if LEADS_URL != WEBSITE_URL:
              log(f"Using the LEADS_SUPABASE_URL secret instead of the built-in website address")

          pasted_key = env("LEADS_SUPABASE_KEY")
          claims = jwt_claims(pasted_key) if pasted_key else None
          if pasted_key and claims and claims.get("ref") == WEBSITE_PROJECT_REF and claims.get("role") == "anon":
              LEADS_KEY = pasted_key
          else:
              if pasted_key:
                  log("The pasted LEADS_SUPABASE_KEY secret is damaged (it does not decode as this website's public key). "
                      "Using the built-in public key instead - you can delete that secret.")
              LEADS_KEY = WEBSITE_ANON_KEY

          LEADS_ADMIN_EMAIL = env("LEADS_ADMIN_EMAIL") or WATCHDOG_EMAIL
          LEADS_ADMIN_PASSWORD = env("LEADS_ADMIN_PASSWORD")
          BOT_TOKEN = re.sub(r"^bot", "", env("TELEGRAM_BOT_TOKEN"))
          CHAT_ID = env("TELEGRAM_CHAT_ID")
          AGENT_NAME = "LEAD DELIVERY HEARTBEAT"
          problems = []

          def hdr(key, **extra):
              return {"apikey": key, "Authorization": f"Bearer {key}", **extra}

          # ---------- Telegram ----------
          def tg(method, payload):
              r = requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/{method}", json=payload, timeout=15)
              try:
                  return r.status_code, r.json()
              except Exception:
                  return r.status_code, {}

          def token_variants(tok):
              # Capital I and small l (and O / 0) look identical in many fonts. Try every combination.
              import itertools
              spots = [i for i, ch in enumerate(tok) if ch in "Il0O"]
              if not spots or len(spots) > 8:
                  return []
              out = []
              for combo in itertools.product(*[("I", "l") if tok[i] in "Il" else ("0", "O") for i in spots]):
                  t = list(tok)
                  for i, ch in zip(spots, combo):
                      t[i] = ch
                  t = "".join(t)
                  if t != tok:
                      out.append(t)
              return out

          def telegram_token_ok():
              global BOT_TOKEN
              if not re.fullmatch(r"\d{6,12}:[A-Za-z0-9_-]{30,}", BOT_TOKEN):
                  log("Telegram bot token is not the right shape. It should look like 1234567890:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx")
                  log("  -> Fix: GitHub repo > Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN > Update,")
                  log("     and paste ONLY the token from @BotFather (tap it in Telegram to copy) - no other words.")
                  problems.append("Telegram bot token is wrong")
                  return False
              code, data = tg("getMe", {})
              if code == 200 and data.get("ok"):
                  log(f"Telegram bot token OK (bot: @{data['result'].get('username')})")
                  return True
              log(f"Telegram rejected the stored bot token ({code}): {data.get('description')}")
              original = BOT_TOKEN
              for cand in token_variants(original):
                  BOT_TOKEN = cand
                  code, data = tg("getMe", {})
                  if code == 200 and data.get("ok"):
                      log(f"Found the right spelling by trying look-alike letters (I/l, O/0). Bot: @{data['result'].get('username')}")
                      # Never print the working token here: GitHub only masks the exact stored secret,
                      # so a corrected variant would land in the log in plain text.
                      log("  -> The stored TELEGRAM_BOT_TOKEN has a look-alike-letter typo. It still works, but to stop this")
                      log("     search every run: GitHub repo > Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN >")
                      log("     Update, and paste the token straight from @BotFather (tap it in Telegram to copy) rather than retyping it.")
                      return True
              BOT_TOKEN = original
              log("  -> No spelling of this token works. Fix: GitHub repo > Settings > Secrets and variables > Actions >")
              log("     TELEGRAM_BOT_TOKEN > Update, and paste the token from @BotFather (tap it in Telegram to copy).")
              problems.append("Telegram bot token is wrong")
              return False

          def resolve_chat_id():
              # A bot username (e.g. @SunriseContentBot) can't receive messages. Use the most
              # recent chat that has messaged the bot instead.
              code, data = tg("getUpdates", {"limit": 100})
              for upd in reversed(data.get("result", [])):
                  msg = upd.get("message") or upd.get("channel_post") or {}
                  if msg.get("chat", {}).get("id"):
                      return msg["chat"]["id"]
              log("  -> No chats found. Open Telegram, send any message to the bot, then re-run this workflow.")
              return None

          def send_telegram(text):
              code, data = tg("sendMessage", {"chat_id": CHAT_ID, "text": text})
              if code == 200 and data.get("ok"):
                  log("Telegram message sent")
                  return True
              log(f"Telegram send to {CHAT_ID!r} failed ({code}): {data.get('description')}")
              alt = resolve_chat_id()
              if alt and str(alt) != CHAT_ID:
                  log(f"Retrying with chat id {alt} (found via getUpdates)")
                  code, data = tg("sendMessage", {"chat_id": alt, "text": text})
                  if code == 200 and data.get("ok"):
                      log(f"Telegram message sent to {alt}.")
                      log(f"  -> Set the TELEGRAM_CHAT_ID secret to {alt} so this is permanent.")
                      return True
                  log(f"Retry failed ({code}): {data.get('description')}")
              return False

          # ---------- Supabase helpers ----------
          def schema(url, headers):
              r = requests.get(f"{url}/rest/v1/", headers=headers, timeout=20)
              r.raise_for_status()
              return r.json().get("definitions", {})

          def leads_headers():
              """Headers for the leads database: sign in as the watchdog admin user through Supabase Auth
              using the public key, then use that user's session token."""
              if not LEADS_ADMIN_PASSWORD:
                  raise RuntimeError("the LEADS_ADMIN_PASSWORD secret is empty - add it in GitHub > Settings > Secrets and variables > Actions")
              r = requests.post(f"{LEADS_URL}/auth/v1/token", params={"grant_type": "password"},
                                json={"email": LEADS_ADMIN_EMAIL, "password": LEADS_ADMIN_PASSWORD},
                                headers={"apikey": LEADS_KEY, "Content-Type": "application/json"}, timeout=20)
              body = {}
              try:
                  body = r.json()
              except Exception:
                  pass
              token = body.get("access_token")
              if r.status_code != 200 or not token:
                  reason = body.get("error_description") or body.get("msg") or body.get("message") or body.get("error") or r.text[:200]
                  log(f"Admin login failed ({r.status_code}): {reason}")
                  log(f"  email used: {LEADS_ADMIN_EMAIL}   password length: {len(LEADS_ADMIN_PASSWORD)} characters (expected 24)")
                  if "api key" in str(reason).lower():
                      hint = "the website key is wrong - delete the LEADS_SUPABASE_KEY secret so the built-in one is used"
                  elif len(LEADS_ADMIN_PASSWORD) != 24:
                      hint = "the LEADS_ADMIN_PASSWORD secret has the wrong number of characters - re-paste it, nothing else in the box"
                  elif LEADS_ADMIN_EMAIL != WATCHDOG_EMAIL:
                      hint = f"the LEADS_ADMIN_EMAIL secret should be exactly {WATCHDOG_EMAIL}"
                  else:
                      hint = "re-paste the LEADS_ADMIN_PASSWORD secret (only the password, no spaces or quotes)"
                  raise RuntimeError(f"admin login to the leads database failed: {reason}. Fix: {hint}")
              log(f"Logged in to the leads database as {LEADS_ADMIN_EMAIL}")
              return {"apikey": LEADS_KEY, "Authorization": f"Bearer {token}"}

          def discover_leads_table(defs):
              tables = sorted(defs.keys())
              log(f"Tables in the leads database: {', '.join(tables) or '(none)'}")
              cols = lambda t: list(defs.get(t, {}).get("properties", {}).keys())
              candidates = [t for t in tables if "email_sent_at" in cols(t)]
              if not candidates:
                  candidates = [t for t in tables if re.search(r"lead|enquir|inquir|submission|contact", t, re.I)]
              if not candidates:
                  raise RuntimeError("no leads table here. The website leads live in a different database - "
                                     "add LEADS_SUPABASE_URL and LEADS_SUPABASE_KEY secrets pointing at it")
              table = "leads" if "leads" in candidates else candidates[0]
              c = cols(table)
              created = next((x for x in ("created_at", "inserted_at", "submitted_at") if x in c), None)
              sent = "email_sent_at" if "email_sent_at" in c else next((x for x in c if "email" in x and x.endswith("_at")), None)
              log(f"Using table '{table}' (created column: {created}, email-sent column: {sent})")
              log(f"  columns: {', '.join(c)}")
              if not created or not sent:
                  raise RuntimeError(f"table '{table}' has no created/email-sent timestamp columns I recognise")
              return table, created, sent

          def ensure_registered(defs):
              """agent_runs.agent_name must exist in agent_registry. Register once, copying the table's rules."""
              r = requests.get(f"{CRM_URL}/rest/v1/agent_registry", params={"agent_name": f"eq.{AGENT_NAME}", "select": "*"},
                               headers=hdr(CRM_KEY), timeout=20)
              if r.status_code == 200 and r.json():
                  log(f"Agent '{AGENT_NAME}' is registered in agent_registry")
                  return fix_registration(r.json()[0], defs)
              reg = defs.get("agent_registry", {})
              props = reg.get("properties", {})
              required = [c for c in reg.get("required", []) if c != "agent_name"]
              log(f"Registering '{AGENT_NAME}' in agent_registry (columns: {', '.join(props) or '?'}; required: {', '.join(required) or 'none'})")
              sample = {}
              r = requests.get(f"{CRM_URL}/rest/v1/agent_registry", params={"select": "*", "limit": "1"}, headers=hdr(CRM_KEY), timeout=20)
              if r.status_code == 200 and r.json():
                  sample = r.json()[0]
                  log(f"  example existing row: {json.dumps(sample)[:400]}")
              row = {"agent_name": AGENT_NAME}
              now = datetime.now(timezone.utc).isoformat()
              for col in required:
                  t = props.get(col, {}).get("type")
                  if col in sample and sample[col] is not None and not re.search(r"^id$|_id$|_at$", col):
                      row[col] = sample[col]
                  elif t == "boolean":
                      row[col] = True
                  elif t in ("integer", "number"):
                      row[col] = 0
                  elif props.get(col, {}).get("format", "").startswith("timestamp"):
                      row[col] = now
                  else:
                      row[col] = "daily 8am Brisbane lead delivery check (GitHub Actions)"
              for col, val in {"description": "Checks website leads were emailed; alerts Telegram. Runs daily 8am Brisbane via GitHub Actions.",
                               "purpose": "Lead delivery watchdog", "schedule": "daily 22:00 UTC", "cadence": "daily",
                               "owner": "GitHub Actions", "status": "active", "is_active": True, "active": True, "enabled": True}.items():
                  if col in props and col not in row:
                      row[col] = val
              log(f"  inserting: {json.dumps(row)[:400]}")
              r = requests.post(f"{CRM_URL}/rest/v1/agent_registry", json=row,
                                headers=hdr(CRM_KEY, **{"Content-Type": "application/json", "Prefer": "return=minimal"}), timeout=20)
              if r.status_code in (200, 201, 204):
                  log("  registered OK")
                  return fix_registration(row, defs)
              log(f"  registration failed ({r.status_code}): {r.text[:600]}")
              problems.append(f"could not register agent in agent_registry: {r.text[:200]}")
              return False

          def fix_registration(current, defs):
              """Make sure the registry row describes THIS agent (not values copied from another row)."""
              props = defs.get("agent_registry", {}).get("properties", {})
              want = {"cron_utc": "0 22 * * *", "local_schedule": "daily 8:00am Brisbane", "run_mode": "fresh",
                      "owns": ["lead_delivery"], "reads_from": ["leads"],
                      "artifact_kind": "agent_runs", "artifact_locator": AGENT_NAME, "artifact_container": "agent_runs",
                      "expect_within_minutes": 60, "enabled": True,
                      "notes": "GitHub Actions sunrisecaravans-cell/sunrise-caravans-watchdog. Checks website leads were emailed; alerts Telegram; writes heartbeat here."}
              patch = {k: v for k, v in want.items() if k in props and current.get(k) != v}
              if not patch:
                  return True
              log(f"  updating registry details: {', '.join(patch)}")
              url = f"{CRM_URL}/rest/v1/agent_registry"
              h = hdr(CRM_KEY, **{"Content-Type": "application/json", "Prefer": "return=minimal"})
              r = requests.patch(url, params={"agent_name": f"eq.{AGENT_NAME}"}, json=patch, headers=h, timeout=20)
              if r.status_code in (200, 204) or "artifact_kind" not in patch:
                  log("  registry details OK" if r.status_code in (200, 204) else f"  registry update failed ({r.status_code}): {r.text[:300]}")
                  return True
              # artifact_kind may be restricted to known values; retry without it
              patch.pop("artifact_kind")
              r = requests.patch(url, params={"agent_name": f"eq.{AGENT_NAME}"}, json=patch, headers=h, timeout=20)
              log("  registry details OK (artifact_kind left as-is)" if r.status_code in (200, 204) else f"  registry update failed ({r.status_code}): {r.text[:300]}")
              return True

          def write_heartbeat(detail):
              now = datetime.now(timezone.utc).isoformat()
              row = {"agent_name": AGENT_NAME, "due_at": now, "verdict": "landed", "artifact_ref": "heartbeat",
                     "artifact_at": now, "detail": detail[:500], "checked_at": now}
              r = requests.post(f"{CRM_URL}/rest/v1/agent_runs", json=row,
                                headers=hdr(CRM_KEY, **{"Content-Type": "application/json", "Prefer": "return=minimal"}), timeout=20)
              if r.status_code in (200, 201, 204):
                  log(f"Heartbeat written: {detail}")
                  return True
              log(f"Heartbeat write failed ({r.status_code}): {r.text[:800]}")
              return False

          # ---------- main ----------
          def main():
              log("=" * 60)
              log("LEAD DELIVERY WATCHDOG - STARTING")
              log("=" * 60)
              missing = [k for k, v in {"SUPABASE_URL": CRM_URL, "SUPABASE_SECRET_KEY": CRM_KEY,
                                        "TELEGRAM_BOT_TOKEN": BOT_TOKEN, "TELEGRAM_CHAT_ID": CHAT_ID}.items() if not v]
              if missing:
                  log(f"FATAL: missing secrets: {', '.join(missing)}")
                  sys.exit(1)
              log(f"Leads database: {LEADS_URL}")

              tg_ok = telegram_token_ok()

              log("STEP 0: Checking heartbeat registration...")
              crm_defs = None
              try:
                  crm_defs = schema(CRM_URL, hdr(CRM_KEY))
                  ensure_registered(crm_defs)
              except Exception as e:
                  log(f"Could not read CRM schema: {e}")
                  problems.append(f"CRM schema read failed: {e}")

              now = datetime.now(timezone.utc)
              window_start = (now - timedelta(hours=26)).isoformat()
              grace_cutoff = (now - timedelta(minutes=15)).isoformat()

              log("STEP 1: Querying leads from the last 26 hours...")
              leads, stuck = [], []
              try:
                  leads_hdr = leads_headers()
                  leads_defs = crm_defs if (LEADS_URL == CRM_URL and crm_defs is not None) else schema(LEADS_URL, leads_hdr)
                  table, created_col, sent_col = discover_leads_table(leads_defs)
                  r = requests.get(f"{LEADS_URL}/rest/v1/{table}",
                                   params={"select": "*", created_col: f"gte.{window_start}", "order": f"{created_col}.desc"},
                                   headers=leads_hdr, timeout=20)
                  r.raise_for_status()
                  leads = r.json()
                  # Stuck = no email sent AND older than the 15-minute grace period
                  stuck = [l for l in leads if l.get(sent_col) is None and (l.get(created_col) or "") <= grace_cutoff]
                  log(f"Checked {len(leads)} leads, found {len(stuck)} stuck")
              except UnicodeEncodeError as e:
                  log("Could not query leads: a secret still contains characters that are not plain text.")
                  problems.append("could not query leads: a secret contains hidden characters - re-paste it")
              except Exception as e:
                  log(f"Could not query leads: {e}")
                  problems.append(f"could not query leads: {e}")

              alert_ok = True
              if problems:
                  log("STEP 2: Reporting problems to Telegram...")
                  alert_ok = tg_ok and send_telegram("Watchdog ERROR:\n- " + "\n- ".join(problems))
              elif stuck:
                  log(f"STEP 2: Sending Telegram alert for {len(stuck)} stuck lead(s)...")
                  lines = []
                  for l in stuck[:5]:
                      name = " ".join(x for x in (l.get("first_name"), l.get("last_name"), l.get("name")) if x) or "Unknown"
                      lines.append(f"- {name} - {l.get('phone') or l.get('email') or 'no contact'} ({l.get('form_type') or 'form'})")
                  if len(stuck) > 5:
                      lines.append(f"... and {len(stuck) - 5} more")
                  text = ("ALERT: Website leads stuck undelivered\n\n"
                          f"{len(stuck)} lead(s) in the last 26 hours never emailed:\n\n" + "\n".join(lines) +
                          "\n\nThese did NOT reach your inbox. Check /admin or ring them back.")
                  alert_ok = tg_ok and send_telegram(text)
              else:
                  log("STEP 2: No stuck leads, no alert needed")

              log("STEP 3: Writing heartbeat...")
              if problems:
                  detail = "watchdog ran with problems: " + "; ".join(problems)
              else:
                  alert_word = "sent" if (stuck and alert_ok) else ("FAILED" if stuck else "not needed")
                  detail = f"{len(leads)} leads checked, {len(stuck)} stuck, alert {alert_word}"
              hb_ok = write_heartbeat(detail)

              log("=" * 60)
              log("LEAD DELIVERY WATCHDOG - COMPLETE" if (not problems and alert_ok and hb_ok) else "LEAD DELIVERY WATCHDOG - FINISHED WITH ERRORS (see above)")
              log("=" * 60)
              # Never end silently: any failure fails the run, and GitHub emails the repo owner.
              if problems or not alert_ok or not hb_ok:
                  sys.exit(1)

          main()
          PYEOF
