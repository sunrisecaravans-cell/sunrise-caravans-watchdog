name: Lead Delivery Watchdog

on:
  schedule:
    # 22:00 UTC = 8:00 AM Brisbane (AEST, UTC+10)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      # CRM database (heartbeat lives here, in agent_runs)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Website database (where the leads table lives). If these are blank, the CRM database is used.
      LEADS_SUPABASE_URL: ${{ secrets.LEADS_SUPABASE_URL }}
      LEADS_SUPABASE_KEY: ${{ secrets.LEADS_SUPABASE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Install dependencies
        run: pip install requests

      - name: Run Lead Delivery Watchdog
        run: |
          python3 - <<'PYEOF'
          import os, sys, re, json, requests
          from datetime import datetime, timedelta, timezone

          def env(name):
              return (os.getenv(name) or "").strip()

          CRM_URL = env("SUPABASE_URL").rstrip("/")
          CRM_KEY = env("SUPABASE_SECRET_KEY")
          LEADS_URL = (env("LEADS_SUPABASE_URL") or CRM_URL).rstrip("/")
          LEADS_KEY = env("LEADS_SUPABASE_KEY") or CRM_KEY
          BOT_TOKEN = re.sub(r"^bot", "", env("TELEGRAM_BOT_TOKEN"))
          CHAT_ID = env("TELEGRAM_CHAT_ID")
          AGENT_NAME = "LEAD DELIVERY HEARTBEAT"
          problems = []

          def log(msg):
              print(f"[{datetime.now(timezone.utc):%Y-%m-%d %H:%M:%S} UTC] {msg}", flush=True)

          def hdr(key, **extra):
              return {"apikey": key, "Authorization": f"Bearer {key}", **extra}

          # ---------- Telegram ----------
          def tg(method, payload):
              r = requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/{method}", json=payload, timeout=15)
              try:
                  return r.status_code, r.json()
              except Exception:
                  return r.status_code, {}

          def telegram_token_ok():
              code, data = tg("getMe", {})
              if code == 200 and data.get("ok"):
                  log(f"Telegram bot token OK (bot: @{data['result'].get('username')})")
                  return True
              log(f"Telegram REJECTED the bot token ({code}): {data.get('description')}")
              log("  -> Fix: GitHub repo > Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN > Update,")
              log("     paste the token from @BotFather exactly (looks like 123456789:AAxxxxxxxx), nothing else.")
              problems.append("Telegram bot token is wrong")
              return False

          def resolve_chat_id():
              # A bot username (e.g. @SunriseContentBot) can't receive messages. Use the most
              # recent chat that has messaged the bot instead.
              code, data = tg("getUpdates", {"limit": 100})
              for upd in reversed(data.get("result", [])):
                  msg = upd.get("message") or upd.get("channel_post") or {}
                  if msg.get("chat", {}).get("id"):
                      return msg["chat"]["id"]
              log("  -> No chats found. Open Telegram, send any message to the bot, then re-run this workflow.")
              return None

          def send_telegram(text):
              code, data = tg("sendMessage", {"chat_id": CHAT_ID, "text": text})
              if code == 200 and data.get("ok"):
                  log("Telegram message sent")
                  return True
              log(f"Telegram send to {CHAT_ID!r} failed ({code}): {data.get('description')}")
              alt = resolve_chat_id()
              if alt and str(alt) != CHAT_ID:
                  log(f"Retrying with chat id {alt} (found via getUpdates)")
                  code, data = tg("sendMessage", {"chat_id": alt, "text": text})
                  if code == 200 and data.get("ok"):
                      log(f"Telegram message sent to {alt}.")
                      log(f"  -> Set the TELEGRAM_CHAT_ID secret to {alt} so this is permanent.")
                      return True
                  log(f"Retry failed ({code}): {data.get('description')}")
              return False

          # ---------- Supabase helpers ----------
          def schema(url, key):
              r = requests.get(f"{url}/rest/v1/", headers=hdr(key), timeout=20)
              r.raise_for_status()
              return r.json().get("definitions", {})

          def discover_leads_table(defs):
              tables = sorted(defs.keys())
              log(f"Tables in the leads database: {', '.join(tables) or '(none)'}")
              cols = lambda t: list(defs.get(t, {}).get("properties", {}).keys())
              candidates = [t for t in tables if "email_sent_at" in cols(t)]
              if not candidates:
                  candidates = [t for t in tables if re.search(r"lead|enquir|inquir|submission|contact", t, re.I)]
              if not candidates:
                  raise RuntimeError("no leads table here. The website leads live in a different database - "
                                     "add LEADS_SUPABASE_URL and LEADS_SUPABASE_KEY secrets pointing at it")
              table = "leads" if "leads" in candidates else candidates[0]
              c = cols(table)
              created = next((x for x in ("created_at", "inserted_at", "submitted_at") if x in c), None)
              sent = "email_sent_at" if "email_sent_at" in c else next((x for x in c if "email" in x and x.endswith("_at")), None)
              log(f"Using table '{table}' (created column: {created}, email-sent column: {sent})")
              log(f"  columns: {', '.join(c)}")
              if not created or not sent:
                  raise RuntimeError(f"table '{table}' has no created/email-sent timestamp columns I recognise")
              return table, created, sent

          def ensure_registered(defs):
              """agent_runs.agent_name must exist in agent_registry. Register once, copying the table's rules."""
              r = requests.get(f"{CRM_URL}/rest/v1/agent_registry", params={"agent_name": f"eq.{AGENT_NAME}", "select": "*"},
                               headers=hdr(CRM_KEY), timeout=20)
              if r.status_code == 200 and r.json():
                  log(f"Agent '{AGENT_NAME}' is registered in agent_registry")
                  return True
              reg = defs.get("agent_registry", {})
              props = reg.get("properties", {})
              required = [c for c in reg.get("required", []) if c != "agent_name"]
              log(f"Registering '{AGENT_NAME}' in agent_registry (columns: {', '.join(props) or '?'}; required: {', '.join(required) or 'none'})")
              sample = {}
              r = requests.get(f"{CRM_URL}/rest/v1/agent_registry", params={"select": "*", "limit": "1"}, headers=hdr(CRM_KEY), timeout=20)
              if r.status_code == 200 and r.json():
                  sample = r.json()[0]
                  log(f"  example existing row: {json.dumps(sample)[:400]}")
              row = {"agent_name": AGENT_NAME}
              now = datetime.now(timezone.utc).isoformat()
              for col in required:
                  t = props.get(col, {}).get("type")
                  if col in sample and sample[col] is not None and not re.search(r"^id$|_id$|_at$", col):
                      row[col] = sample[col]
                  elif t == "boolean":
                      row[col] = True
                  elif t in ("integer", "number"):
                      row[col] = 0
                  elif props.get(col, {}).get("format", "").startswith("timestamp"):
                      row[col] = now
                  else:
                      row[col] = "daily 8am Brisbane lead delivery check (GitHub Actions)"
              for col, val in {"description": "Checks website leads were emailed; alerts Telegram. Runs daily 8am Brisbane via GitHub Actions.",
                               "purpose": "Lead delivery watchdog", "schedule": "daily 22:00 UTC", "cadence": "daily",
                               "owner": "GitHub Actions", "status": "active", "is_active": True, "active": True, "enabled": True}.items():
                  if col in props and col not in row:
                      row[col] = val
              log(f"  inserting: {json.dumps(row)[:400]}")
              r = requests.post(f"{CRM_URL}/rest/v1/agent_registry", json=row,
                                headers=hdr(CRM_KEY, **{"Content-Type": "application/json", "Prefer": "return=minimal"}), timeout=20)
              if r.status_code in (200, 201, 204):
                  log("  registered OK")
                  return True
              log(f"  registration failed ({r.status_code}): {r.text[:600]}")
              problems.append(f"could not register agent in agent_registry: {r.text[:200]}")
              return False

          def write_heartbeat(detail):
              now = datetime.now(timezone.utc).isoformat()
              row = {"agent_name": AGENT_NAME, "due_at": now, "verdict": "landed", "artifact_ref": "heartbeat",
                     "artifact_at": now, "detail": detail[:500], "checked_at": now}
              r = requests.post(f"{CRM_URL}/rest/v1/agent_runs", json=row,
                                headers=hdr(CRM_KEY, **{"Content-Type": "application/json", "Prefer": "return=minimal"}), timeout=20)
              if r.status_code in (200, 201, 204):
                  log(f"Heartbeat written: {detail}")
                  return True
              log(f"Heartbeat write failed ({r.status_code}): {r.text[:800]}")
              return False

          # ---------- main ----------
          def main():
              log("=" * 60)
              log("LEAD DELIVERY WATCHDOG - STARTING")
              log("=" * 60)
              missing = [k for k, v in {"SUPABASE_URL": CRM_URL, "SUPABASE_SECRET_KEY": CRM_KEY,
                                        "TELEGRAM_BOT_TOKEN": BOT_TOKEN, "TELEGRAM_CHAT_ID": CHAT_ID}.items() if not v]
              if missing:
                  log(f"FATAL: missing secrets: {', '.join(missing)}")
                  sys.exit(1)
              log(f"Leads database: {LEADS_URL}{'  (same as CRM - set LEADS_SUPABASE_URL/KEY if leads live elsewhere)' if LEADS_URL == CRM_URL else ''}")

              tg_ok = telegram_token_ok()

              log("STEP 0: Checking heartbeat registration...")
              crm_defs = None
              try:
                  crm_defs = schema(CRM_URL, CRM_KEY)
                  ensure_registered(crm_defs)
              except Exception as e:
                  log(f"Could not read CRM schema: {e}")
                  problems.append(f"CRM schema read failed: {e}")

              now = datetime.now(timezone.utc)
              window_start = (now - timedelta(hours=26)).isoformat()
              grace_cutoff = (now - timedelta(minutes=15)).isoformat()

              log("STEP 1: Querying leads from the last 26 hours...")
              leads, stuck = [], []
              try:
                  leads_defs = crm_defs if (LEADS_URL == CRM_URL and crm_defs is not None) else schema(LEADS_URL, LEADS_KEY)
                  table, created_col, sent_col = discover_leads_table(leads_defs)
                  r = requests.get(f"{LEADS_URL}/rest/v1/{table}",
                                   params={"select": "*", created_col: f"gte.{window_start}", "order": f"{created_col}.desc"},
                                   headers=hdr(LEADS_KEY), timeout=20)
                  r.raise_for_status()
                  leads = r.json()
                  # Stuck = no email sent AND older than the 15-minute grace period
                  stuck = [l for l in leads if l.get(sent_col) is None and (l.get(created_col) or "") <= grace_cutoff]
                  log(f"Checked {len(leads)} leads, found {len(stuck)} stuck")
              except Exception as e:
                  log(f"Could not query leads: {e}")
                  problems.append(f"could not query leads: {e}")

              alert_ok = True
              if problems:
                  log("STEP 2: Reporting problems to Telegram...")
                  alert_ok = tg_ok and send_telegram("Watchdog ERROR:\n- " + "\n- ".join(problems))
              elif stuck:
                  log(f"STEP 2: Sending Telegram alert for {len(stuck)} stuck lead(s)...")
                  lines = []
                  for l in stuck[:5]:
                      name = " ".join(x for x in (l.get("first_name"), l.get("last_name"), l.get("name")) if x) or "Unknown"
                      lines.append(f"- {name} - {l.get('phone') or l.get('email') or 'no contact'} ({l.get('form_type') or 'form'})")
                  if len(stuck) > 5:
                      lines.append(f"... and {len(stuck) - 5} more")
                  text = ("ALERT: Website leads stuck undelivered\n\n"
                          f"{len(stuck)} lead(s) in the last 26 hours never emailed:\n\n" + "\n".join(lines) +
                          "\n\nThese did NOT reach your inbox. Check /admin or ring them back.")
                  alert_ok = tg_ok and send_telegram(text)
              else:
                  log("STEP 2: No stuck leads, no alert needed")

              log("STEP 3: Writing heartbeat...")
              if problems:
                  detail = "watchdog ran with problems: " + "; ".join(problems)
              else:
                  alert_word = "sent" if (stuck and alert_ok) else ("FAILED" if stuck else "not needed")
                  detail = f"{len(leads)} leads checked, {len(stuck)} stuck, alert {alert_word}"
              hb_ok = write_heartbeat(detail)

              log("=" * 60)
              log("LEAD DELIVERY WATCHDOG - COMPLETE" if (not problems and alert_ok and hb_ok) else "LEAD DELIVERY WATCHDOG - FINISHED WITH ERRORS (see above)")
              log("=" * 60)
              # Never end silently: any failure fails the run, and GitHub emails the repo owner.
              if problems or not alert_ok or not hb_ok:
                  sys.exit(1)

          main()
          PYEOF
